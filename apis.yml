aid: baz-technologies
name: Baz Technologies
description: >-
  Baz Technologies (Baz) is a Tel Aviv-based engineering review platform that uses
  purpose-built AI agents — code review, spec review, advanced security, SRE, and an
  automated fixer — to review implementation plans, pull requests, security findings,
  and merge decisions across the whole software development lifecycle. Baz reads the
  entire codebase alongside production telemetry to catch bugs and vulnerabilities
  before they ship, integrating with GitHub, GitLab, and Azure DevOps and issue/observability
  tools (Jira, Linear, Datadog, Sentry). It exposes its context-aware reviews to
  AI-native IDEs and CLIs (Cursor, Claude, VS Code) through a hosted Model Context
  Protocol (MCP) server, an npm-distributed CLI, and a coding-agent plugin. Backed by
  Battery Ventures and boldstart ventures with $17M in seed funding.
